# ChangeLens AI — full local stack (Phase 9: frontend + backend + ai-service + postgres).
#
# Usage:  docker compose up -d --build
#         docker compose down     (keeps the pgdata volume)
#         docker compose down -v  (also deletes data)
#
# Production topology: browser → nginx (frontend, :8080) → /api proxy → backend (:5000)
# → internal FastAPI (:8000, reachable only by backend on the compose network). The
# ai-service port is exposed on the host only for local development — remove the
# `ports:` block before any shared deployment (docs/deployment-strategy.md).
#
# No Docker? Use scripts/start-local-postgres.sh for PostgreSQL and run the
# backend / ai-service / frontend directly (see backend/README.md, ai-service/README.md,
# frontend/README.md).
#
# Secrets come from the environment / .env (see .env.example). NEVER commit .env.

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: changelens-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-changelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changelens_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-changelens}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # pg18 images store data in a subdirectory; mount the parent (not the legacy
      # /var/lib/postgresql/data layout) so `docker compose down -v` clean-starts.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-changelens} -d ${POSTGRES_DB:-changelens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./ai-service
    container_name: changelens-ai
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set (see .env.example)}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-3.1-flash-lite}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-60}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-3}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-8192}
      AI_MAX_REPAIR_ATTEMPTS: ${AI_MAX_REPAIR_ATTEMPTS:-2}
      AI_READINESS_PROBE: ${AI_READINESS_PROBE:-false}
      AI_AUTO_RETRIEVE: ${AI_AUTO_RETRIEVE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Phase 3: the ai schema lives in the same PostgreSQL instance (ai schema owned by this service).
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-changelens}:${POSTGRES_PASSWORD:-changelens_dev_password}@postgres:5432/${POSTGRES_DB:-changelens}"
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-10}
      RETRIEVAL_CANDIDATE_K: ${RETRIEVAL_CANDIDATE_K:-50}
      RRF_K: ${RRF_K:-60}
    # DEV ONLY: exposes the AI service on the host. Remove for shared deployments —
    # the backend is the only legitimate client (docs/deployment-strategy.md §2).
    ports:
      - "${AI_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      args:
        BUILD_CONFIGURATION: Release
    container_name: changelens-backend
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-changelens};Username=${POSTGRES_USER:-changelens};Password=${POSTGRES_PASSWORD:-changelens_dev_password}"
      Jwt__Issuer: ${JWT_ISSUER:-changelens-dev}
      Jwt__Audience: ${JWT_AUDIENCE:-changelens-client}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set (see .env.example)}
      Seed__Enabled: "true"
      # Phase 10 clean-start: apply EF migrations on startup so an empty volume
      # becomes a working demo without manual `dotnet ef database update`.
      Db__ApplyMigrationsOnStartup: "true"
      # The backend talks to the AI service by Docker service name, never localhost.
      Ai__BaseUrl: http://ai-service:8000
      Ai__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set (see .env.example)}
      # Phase 9: controlled CORS + in-memory analysis rate limiting (single instance).
      Cors__AllowedOrigins: ${CORS__ALLOWEDORIGINS:-http://localhost:8080;http://localhost:5173;http://127.0.0.1:8080;http://127.0.0.1:5173}
      RateLimit__AnalysisPermitLimit: ${RATE_LIMIT_ANALYSIS_PERMIT_LIMIT:-10}
      RateLimit__AnalysisWindowSeconds: ${RATE_LIMIT_ANALYSIS_WINDOW_SECONDS:-60}
      # Roslyn/Git change analysis reads the demo repository; mount it read-only.
      # (Auto-discovery looks for data/demo-repository relative to the app base dir,
      # which does not exist inside the image — so RootPath is set explicitly.)
      ChangeSource__RootPath: /workspace
    volumes:
      - ./data:/workspace/data:ro
    ports:
      - "${API_PORT:-5000}:5000"
    healthcheck:
      # DB-gated: /api/v1/health includes the PostgreSQL check, unlike /health.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/api/v1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: changelens-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pgdata:

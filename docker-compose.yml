# ChangeLens AI — local development stack.
#
# Phase 1: PostgreSQL only (with pgvector for the future ai schema).
# Phase 9 expands this file to the full four-service stack
# (frontend, backend, ai-service, postgres) — see docs/development-sequence.md.
#
# Usage:  docker compose up -d
#         docker compose down     (keeps the pgdata volume)
#         docker compose down -v  (also deletes data)
#
# No Docker? Use scripts/start-local-postgres.sh instead.

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: changelens-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-changelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changelens_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-changelens}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-changelens} -d ${POSTGRES_DB:-changelens}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

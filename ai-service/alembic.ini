# Alembic for the ChangeLens `ai` schema (owned by the AI service — ADR-0003).
# The .NET backend owns the `app` schema via EF Core; these two never cross.
#
# The database URL comes from the DATABASE_URL environment variable (see app/config.py
# for the default) — env.py reads it; do not put credentials here.

[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

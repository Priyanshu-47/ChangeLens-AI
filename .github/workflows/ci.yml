name: CI

# Phase 9: full $0 CI — backend (build + unit + PostgreSQL integration), Python
# (unit + PostgreSQL DB integration), frontend (build + tests), and the
# deterministic evaluation runner. All providers are mocked: ZERO Gemini calls,
# no API keys, no AWS. Live Gemini tests (test_gemini_live.py) are gated by
# RUN_GEMINI_TESTS=true and are never part of this workflow.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: .NET — build, unit, integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: changelens
          POSTGRES_PASSWORD: changelens_test_password
          POSTGRES_DB: changelens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U changelens -d changelens_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore + build
        working-directory: backend
        run: dotnet build -v q

      - name: Unit tests (no database needed)
        working-directory: backend
        run: dotnet test tests/ChangeLens.UnitTests/ChangeLens.UnitTests.csproj -v q --no-build

      - name: Integration tests (PostgreSQL service container)
        working-directory: backend
        env:
          # Point the tests at the service container instead of spinning up
          # Testcontainers (DatabaseFixture honours this override).
          CHANGELENS_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=changelens_test;Username=changelens;Password=changelens_test_password
        run: dotnet test tests/ChangeLens.Api.IntegrationTests/ChangeLens.Api.IntegrationTests.csproj -v q --no-build

  python:
    name: Python — unit + DB integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: changelens
          POSTGRES_PASSWORD: changelens_test_password
          POSTGRES_DB: changelens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U changelens -d changelens_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Migrate ai schema (Alembic, creates pgvector extension)
        env:
          DATABASE_URL: postgresql+psycopg://changelens:changelens_test_password@localhost:5432/changelens_test
        run: alembic upgrade head

      # The /ready probe checks DB connectivity + the pgvector extension, so unit
      # tests point at the service container (migrated above). Zero Gemini calls.
      - name: Unit tests
        env:
          DATABASE_URL: postgresql+psycopg://changelens:changelens_test_password@localhost:5432/changelens_test
        run: python -m pytest tests/ -q --ignore=tests/test_db_integration.py

      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://changelens:changelens_test_password@localhost:5432/changelens_test
        run: python -m pytest tests/test_db_integration.py -q

  frontend:
    name: Frontend — build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck + production build
        run: npm run build

      - name: Tests
        run: npm test

  evaluation:
    name: Evaluation runner (mock providers, zero Gemini)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: changelens
          POSTGRES_PASSWORD: changelens_test_password
          POSTGRES_DB: changelens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U changelens -d changelens_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Migrate ai schema
        env:
          DATABASE_URL: postgresql+psycopg://changelens:changelens_test_password@localhost:5432/changelens_test
        run: alembic upgrade head

      - name: Seed demo corpus (mock embeddings)
        env:
          DATABASE_URL: postgresql+psycopg://changelens:changelens_test_password@localhost:5432/changelens_test
          EMBEDDING_PROVIDER: mock
          INTERNAL_API_KEY: ci-internal-key
          AI_PROVIDER: mock
        run: python scripts/seed_demo.py --project-id demo-project

      - name: Run deterministic evaluation
        env:
          DATABASE_URL: postgresql+psycopg://changelens:changelens_test_password@localhost:5432/changelens_test
          INTERNAL_API_KEY: ci-internal-key
        run: python -m app.evaluation.run --project-id demo-project

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secret-like patterns
        shell: bash
        run: |
          set -euo pipefail
          # Fail on anything that looks like a real credential (not the .env.example template).
          if git grep -nE "AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY" -- ':!data/demo-repository' ':!docs' ':!README.md' 2>/dev/null; then
            echo "::error::Possible secret material found in the working tree."
            exit 1
          fi
          echo "Secret scan clean."
